services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_PATH: /app/data/keuangan-apotek.sqlite
      AUTH_SECRET: ${AUTH_SECRET:-}
      SEED_DEFAULT_COA: ${SEED_DEFAULT_COA:-}
      SEED_DEFAULT_USERS: ${SEED_DEFAULT_USERS:-}
    volumes:
      - apotek_data:/app/data
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - caddy
    labels:
      caddy: ${APP_URL}
      caddy.reverse_proxy: "{{upstreams 80}}"

volumes:
  apotek_data:

networks:
  internal:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
